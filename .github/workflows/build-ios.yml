name: Build iOS IPA for Sideloadly

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-ios:
    name: Build Unsigned IPA
    runs-on: macos-14

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🛠️ Expo Prebuild iOS Project
        run: npx expo prebuild --platform ios --clean

      - name: 🔨 Compile iOS Binary (Unsigned)
        run: |
          cd ios
          pod install || true
          
          # Auto-detect workspace and scheme
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          
          if [ -z "$WORKSPACE" ]; then
            PROJECT=$(ls -d *.xcodeproj 2>/dev/null | head -n 1)
            SCHEME=$(basename "$PROJECT" .xcodeproj)
            BUILD_TARGET="-project $PROJECT"
          else
            SCHEME=$(basename "$WORKSPACE" .xcworkspace)
            BUILD_TARGET="-workspace $WORKSPACE"
          fi
          
          echo "Building Target: $BUILD_TARGET with Scheme: $SCHEME"
          
          xcodebuild \
            $BUILD_TARGET \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/Sonance.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: 📦 Package .IPA for Sideloadly
        run: |
          mkdir -p build/Payload
          cp -R build/Sonance.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r Sonance.ipa Payload

      - name: 🚀 Upload Sonance.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonance-IPA
          path: build/Sonance.ipa
          retention-days: 14
