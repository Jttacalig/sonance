name: Build iOS IPA for Sideloadly

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-ios:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🍎 Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🛠️ Expo Prebuild iOS Project
        run: npx expo prebuild --platform ios --clean

      - name: 🔨 Compile iOS Binary (Unsigned)
        run: |
          # Guarantee Xcode build phase scripts locate the runner's Node.js binary
          sudo ln -sf $(which node) /usr/local/bin/node || true
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local
          
          cd ios
          
          # Auto-detect workspace
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            pod install
            WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          fi
          
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building Workspace: $WORKSPACE with Scheme: $SCHEME"
          
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 📦 Package .IPA for Sideloadly
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r -q Sonance.ipa Payload

      - name: 🚀 Upload Sonance.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonance-IPA
          path: build/Sonance.ipa
          retention-days: 14
