name: Build Android APK (Android 8.0+)

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-*'
      - 'v*-android'

jobs:
  build-android:
    name: Build Universal APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📥 Install Android SDK Platform, Build-Tools & NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" "cmake;3.22.1"

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: 🛠️ Expo Prebuild Android Project
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🔑 Generate Keystore for Signing
        run: |
          mkdir -p android/app
          keytool -genkey -v -keystore android/app/release.keystore \
            -alias sonance-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass sonancepass123 \
            -keypass sonancepass123 \
            -dname "CN=Sonance, OU=Music, O=SonanceApp, L=Global, S=World, C=US"

      - name: 🔨 Build Signed Release APK
        run: |
          # Guarantee Gradle sub-processes find Node
          sudo ln -sf $(which node) /usr/local/bin/node || true
          
          cd android
          chmod +x gradlew
          
          KEYSTORE_PATH="$GITHUB_WORKSPACE/android/app/release.keystore"
          
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password=sonancepass123 \
            -Pandroid.injected.signing.key.alias=sonance-key \
            -Pandroid.injected.signing.key.password=sonancepass123 \
            -Pandroid.suppressUnsupportedCompileSdk=35 \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
            --no-daemon \
            --stacktrace

      - name: 📦 Rename & Organize APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} output/Sonance-Universal-Release.apk \;
          ls -lh output/

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonance-Android-APK
          path: output/Sonance-Universal-Release.apk
          if-no-files-found: error
          retention-days: 14
